name: Bug report
description: Something in Symbio doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Questions and ideas are welcome in [Discussions](https://github.com/linkzy/symbio/discussions); security problems go privately through **Security → Report a vulnerability**, not here.
        Symbio's **Report a problem** button (top bar) opens this form with your versions filled in.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Symbio version
      description: Settings → Updates, or `sym --version`.
      placeholder: "0.23.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Agent runtime and its version
      description: OpenCode or GitHub Copilot CLI (`sym doctor` lists the installed ones).
      placeholder: "OpenCode 2.1.4"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: "`node --version`"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Errors from the browser console, or `sym logs`. Remove API keys, tokens and private content.
      render: text
